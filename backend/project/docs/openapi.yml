    NotificationTypeEnum:
      enum:
      - DATASET_SUBMITTED
      - CORRECTION_REQUESTED
      - DATASET_ACCEPTED
      - DATASET_REJECTED
      - CONTESTATION
      - EXPLANATION_REQUESTED
      - RESPONSE_RECEIVED
      - DECISION
      - DEADLINE
      - SCRAPING_FAILED
      - PREDICTION_DONE
      - SURVEY_APPROVAL
      - OTHER
      type: string
      description: |-
        * `DATASET_SUBMITTED` - Nouvelle soumission de dataset
        * `CORRECTION_REQUESTED` - Demande de correction
        * `DATASET_ACCEPTED` - Dataset accepté
        * `DATASET_REJECTED` - Dataset rejeté
        * `CONTESTATION` - Nouvelle contestation
        * `EXPLANATION_REQUESTED` - Demande d'explication
        * `RESPONSE_RECEIVED` - Réponse reçue
        * `DECISION` - Décision rendue
        * `DEADLINE` - Échéance proche
        * `SCRAPING_FAILED` - Échec de scraping
        * `PREDICTION_DONE` - Prédiction terminée
        * `SURVEY_APPROVAL` - Sondage à valider
        * `OTHER` - Autre
