components:
  schemas:
    ActionUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ActionUpdateStatusEnum'
        report:
          type: string
      required:
      - status
    ActionUpdateStatusEnum:
      enum:
      - IN_PROGRESS
      - SUBMITTED
      type: string
      description: |-
        * `IN_PROGRESS` - IN_PROGRESS
        * `SUBMITTED` - SUBMITTED
    AdminUser:
      type: object
      description: Création / gestion des comptes professionnels — réservée à SYSTEM_ADMIN.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        organization:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Dernière connexion
      required:
      - date_joined
      - email
      - id
      - last_login
    AdminUserRequest:
      type: object
      description: Création / gestion des comptes professionnels — réservée à SYSTEM_ADMIN.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        organization:
          type: string
          minLength: 1
          nullable: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        operator:
          type: string
          readOnly: true
        obligation:
          type: integer
          readOnly: true
        obligation_title:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AlertStatusEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        measured_value:
          type: number
          format: double
          readOnly: true
        nature:
          type: string
          readOnly: true
        handling_note:
          type: string
          readOnly: true
        handled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cases:
          type: array
          items:
            type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cases
      - created_at
      - handled_at
      - handling_note
      - id
      - measured_value
      - message
      - nature
      - obligation
      - obligation_title
      - operator
      - severity
      - status
    AlertActionRequest:
      type: object
      properties:
        note:
          type: string
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date
          nullable: true
    AlertStatusEnum:
      enum:
      - NEW
      - ACKNOWLEDGED
      - DISMISSED
      - ESCALATED
      type: string
      description: |-
        * `NEW` - Nouvelle
        * `ACKNOWLEDGED` - Prise en compte
        * `DISMISSED` - Classée sans suite
        * `ESCALATED` - Transformée en dossier
    AnswerInRequest:
      type: object
      properties:
        question:
          type: integer
        value:
          nullable: true
      required:
      - question
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        original_name:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - original_name
      - size
    AttachmentUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    AudienceEnum:
      enum:
      - PUBLIC
      - INTERNAL
      type: string
      description: |-
        * `PUBLIC` - Public
        * `INTERNAL` - Interne (organismes connectés)
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor_email:
          type: string
          readOnly: true
        actor_organization:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor_email
      - actor_organization
      - id
      - metadata
      - resource_id
      - resource_type
      - timestamp
    AuthorKindEnum:
      enum:
      - SUBMITTER
      - ARTEC
      type: string
      description: |-
        * `SUBMITTER` - Déposant
        * `ARTEC` - ARTEC
    BarometerSetting:
      type: object
      properties:
        enabled:
          type: boolean
        min_measurements:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - updated_at
    BarometerSettingRequest:
      type: object
      properties:
        enabled:
          type: boolean
        min_measurements:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
    BuildTrainingSetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        risk_type:
          allOf:
          - $ref: '#/components/schemas/RiskTypeEnum'
          default: GENERAL_QUALITY
        granularity:
          allOf:
          - $ref: '#/components/schemas/GranularityEnum'
          default: month
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourcesEnum'
          default:
          - TECHNICAL
    Case:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference_number:
          type: string
          readOnly: true
        operator:
          type: string
        case_type:
          $ref: '#/components/schemas/CaseTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/CaseStatusEnum'
          readOnly: true
        title:
          type: string
          maxLength: 250
        description:
          type: string
        related_prediction:
          type: integer
          nullable: true
        related_dataset_submission:
          type: integer
          nullable: true
        opened_by:
          type: integer
          readOnly: true
        assigned_to:
          type: integer
          nullable: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
        deadline:
          type: string
          format: date
          nullable: true
        closed_at:
          type: string
          format: date-time
