  /api/v1/comments/:
    get:
      operationId: v1_comments_list
      description: Dépôt public (modéré) + liste publique des commentaires approuvés
        + modération.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: publication
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - HIDDEN
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - En attente
          * `APPROVED` - Approuvé
          * `REJECTED` - Rejeté
          * `HIDDEN` - Masqué
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentModerationList'
          description: ''
    post:
      operationId: v1_comments_create
