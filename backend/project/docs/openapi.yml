        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - CRITICAL
          - INFO
          - WARNING
        description: |-
          * `INFO` - Information
          * `WARNING` - Vigilance
          * `CRITICAL` - Écart important
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACKNOWLEDGED
          - DISMISSED
          - ESCALATED
          - NEW
        description: |-
          * `NEW` - Nouvelle
          * `ACKNOWLEDGED` - Prise en compte
          * `DISMISSED` - Classée sans suite
          * `ESCALATED` - Transformée en dossier
