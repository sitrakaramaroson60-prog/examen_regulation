openapi: 3.0.3
info:
  title: Plateforme de régulation des télécommunications — API
  version: 1.0.0
  description: API REST du backend (ARTEC, YAS, AIRTEL, ORANGE).
paths:
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      description: 'Consultation seule. SYSTEM_ADMIN et ARTEC_REGULATOR : vue globale
        ; les autres : leur organisation.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/{id}/:
    get:
      operationId: v1_audit_retrieve
